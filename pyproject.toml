[project]
name = "multidomain-rag"
version = "0.1.0"
description = "High-performance, modular, domain-agnostic Retrieval-Augmented Generation (RAG) engine."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    # --- Interface & Web ---
    "gradio==5.29.0",
    "requests==2.32.3",
    # --- Python 3.13 compatibility (audioop) ---
    "audioop-lts==0.2.1",
    # --- Environment & Configuration ---
    "python-dotenv==1.0.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "typing-extensions>=4.12.0",
    # --- AI & NLP ---
    "huggingface-hub>=1.5.0,<2.0",
    "sentence-transformers>=3.3.0",
    "transformers==5.7.0",
    "torch==2.6.0",
    # --- Documents & Vector Store ---
    "pymupdf==1.25.1",
    "qdrant-client==1.12.0",
    # --- HTTP client (LM Studio integration) ---
    "httpx>=0.27.0",
    # --- Speech-to-Text ---
    "faster-whisper>=1.0.0",
    "pydub==0.25.1",
    "ffmpeg-python==0.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["src"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=src --cov-fail-under=80"
